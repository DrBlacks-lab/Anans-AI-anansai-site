name: Apply site hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-site-hardening.yml
      - tools/apply_site_hardening.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded patch
        run: python tools/apply_site_hardening.py
      - name: Validate static artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          assert len(re.findall(r'class="ck-step"',s)) == 12
          assert len(re.findall(r'class="fixture"',s)) == 3
          assert 'fonts.googleapis.com' not in s
          assert 'fonts.gstatic.com' not in s
          assert 'style=' not in s
          assert 'Content-Security-Policy' in s
          assert 'One external reviewer has run the public bundle' not in s
          assert 'py -m pip install pynacl' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts) == 2
          Path('/tmp/site.js').write_text(scripts[1],encoding='utf-8')
          print('STATIC_VALIDATION_PASS')
          PY
          node --check /tmp/site.js
      - name: Commit hardened site
        run: |
          if git diff --quiet -- index.html; then
            echo 'NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add recorded-state comparison and transport hardening'
          git push
